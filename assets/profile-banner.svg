<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">주상혁 · Backend Developer</title>
  <desc id="desc">Java와 Spring Boot로 백엔드 서비스를 만드는 주상혁의 GitHub 프로필 배너</desc>
  <defs>
