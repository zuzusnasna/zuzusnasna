    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#657861"/>
      <stop offset="1" stop-color="#a9b99c"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#d6e0d2" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="75%" cy="32%" r="62%">
